<!--.htm and .html files are used to create web pages. The code above is a basic HTML structure that includes the necessary elements to define a web page , such as the doctype declaration html,head , and body tags. The head section contains metadata about the document, including the character set and viewport settings for responsive design. The title tag specifies the title of the web page that appears in the browser tab. The body section is where the content of the web page will be placed.-->

<!--print hello world in the body section of the html file-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <!--this is title of the page-->
    <title> My First Page </title>
</head>
<body>
    <h1>hello world!</h1>
    <p> This is a simple paragraph</p>
</body>
</html>

<!--what is html tag? => it is content or other elements that are used to define the structure and content of a web page HTML tags are enclosed in angle bracket and usually come in pairs, with an opening tag and closing tag. The opening tag indicates the start of an element, while the closing tag indicates the end of that element. for example, the <p> tag is used to define a paragraph.</p>
