<!-- % in animation -->


<!--
    @keyframe myName {
        0% { font-size: 20px; }
        50% { font-size: 30px; }
        100% { font-size: 40px; }
    }
-->
<!--
    @keyframes rule is used to define the intermediate steps in an animation sequence.
    It allows you to specify the styles that an element should have at specific points during the animation 
-->
<!-- 
    In CSS animations, you can use percentages to define keyframes.
    For example, 0% represents the start of the animation, and 100% represents the end.
-->

<!--
    You can also use intermediate percentages to create more complex animations.
    For example, you can define keyframes at 25%, 50%, and 75% to create a multi-step animation.
-->
