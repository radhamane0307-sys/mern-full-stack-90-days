<!-- css transform notes -->

<!-- translate -->

<!--
    transform: translate(20px);
    transform: translate(20px, 50px);

        transform: translatex(20px);
        transform: translateY(50px);

-->

<!--
    translate(x,y) function is used to move an element from its current position to a new position along the x and y axis.
-->

<!--

    translateX(x) function is used to move an element from its current position to a new position along the x axis.
-->

<!--

    translateY(y) function is used to move an element from its current position to a new position along the y axis.
-->

<!--
    translateZ(z) function is used to move an element from its current position to a new position along the z axis.
-->

<!--
    rotate(angle) function is used to rotate an element around its center point.
-->

<!--
    rotateX(x) function is used to rotate an element around its x-axis.
-->

<!--
    rotateY(y) function is used to rotate an element around its y-axis.
-->

<!--
    rotateZ(z) function is used to rotate an element around its z-axis.
-->

<!--
    scale(x,y) function is used to change the size of an element along the x and y axis.
-->

<!--
    scale(x,y) function is used to change the size of an element along the x and y axis.
-->

<!--
    scaleX(x) function is used to change the size of an element along the x axis.
-->

<!--
    scaleY(y) function is used to change the size of an element along the y axis.
-->

<!--
    
    scaleZ(z) function is used to change the size of an element along the z axis.
-->

<!--
    skew(x,y) function is used to skew an element along the x and y axis.
-->

<!--skew-->

<!-- transform: skew(30deg); -->

<!-- skewX(x) function is used to skew an element along the x axis. -->
<!-- skewY(y) function is used to skew an element along the y axis. -->
